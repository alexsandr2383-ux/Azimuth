name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # ubuntu-latest runners ship with the Android SDK preinstalled; the
      # android-actions/setup-android step fails on current images, so accept
      # licences instead (gradle needs them for the SDK packages present).
      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
      - uses: gradle/actions/setup-gradle@v4
      - name: Desktop tests
        run: ./gradlew :composeApp:desktopTest --console=plain
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: composeApp/build/reports/tests/
      - name: Android debug build
        run: ./gradlew :composeApp:assembleDebug --console=plain
