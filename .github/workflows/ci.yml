name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # ubuntu-latest runners ship with the Android SDK preinstalled; the
      # android-actions/setup-android step fails on current images, so accept
      # licences instead (gradle needs them for the SDK packages present).
      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
      - uses: gradle/actions/setup-gradle@v4
      - name: Desktop tests
        run: ./gradlew :composeApp:desktopTest --console=plain
      - name: Summarise failing tests
        if: failure()
        run: |
          echo "## Failing tests" >> "$GITHUB_STEP_SUMMARY"
          grep -l "<failure" composeApp/build/test-results/desktopTest/TEST-*.xml >> "$GITHUB_STEP_SUMMARY" || true
          for f in composeApp/build/test-results/desktopTest/TEST-*.xml; do
            grep -oE '<failure message="[^"]*"' "$f" | head -3 >> "$GITHUB_STEP_SUMMARY" || true
          done
      - name: Android debug build
        run: ./gradlew :composeApp:assembleDebug --console=plain
